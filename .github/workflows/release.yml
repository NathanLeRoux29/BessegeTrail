# Versions et images (spec 09, DEP-11 et DEP-13) : à chaque push sur dev, preprod
# ou main, semantic-release calcule la version à partir des messages de commit
# (release.config.mjs), crée le tag et la release GitHub, puis les images sont
# publiées sur GHCR avec cette version comme tag.
name: release

on:
  push:
    branches: [dev, preprod, main]

permissions:
  contents: read

# Les releases s'enchaînent dans l'ordre des push, sans en annuler aucune.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tags et releases
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique et les tags, pour calculer la version
      - uses: ./.github/actions/setup
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Version créée par ce push : le tag posé sur le commit, s'il y en a un.
      - id: version
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  images:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publication sur GHCR
    strategy:
      matrix:
        app: [site, admin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ needs.release.outputs.version }}
          tags: ghcr.io/nathanleroux29/bessege-${{ matrix.app }}:${{ needs.release.outputs.version }}
          push: true
          # Même cache que le job build de la CI : seule la dernière couche change.
          cache-from: type=gha,scope=${{ matrix.app }}
