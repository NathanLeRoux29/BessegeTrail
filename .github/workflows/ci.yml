# Vérifie chaque changement (spec 09, DEP-06 à DEP-09). Les noms des jobs sont
# les checks exigés par les règles de protection de preprod et main : ne pas les
# renommer sans mettre à jour ces règles.
name: ci

on:
  push:
    branches: [dev]
  # PR vers preprod et main (checks obligatoires) et vers dev (Dependabot, DEP-21).
  pull_request:
    branches: [dev, preprod, main]

permissions:
  contents: read

# Un nouveau push annule la vérification en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet, pour vérifier les messages de commit
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # DEP-10 : messages des commits poussés (ou de la PR) au format Conventional Commits.
      - name: Messages de commit
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Première poussée d'une branche : pas de commit précédent, on vérifie le dernier.
          if [ "$FROM" = 0000000000000000000000000000000000000000 ]; then FROM="$TO~1"; fi
          pnpm exec commitlint --from "$FROM" --to "$TO" --verbose

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Tests unitaires et d'API, avec le seuil de couverture de 80 % (DEP-08).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Images de production, transmises au job e2e sous forme d'archives.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image du site
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          build-args: APP=site
          tags: bessege/site:e2e
          outputs: type=docker,dest=${{ runner.temp }}/site.tar
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
      - name: Image de l'admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          build-args: APP=admin
          tags: bessege/admin:e2e
          outputs: type=docker,dest=${{ runner.temp }}/admin.tar
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/*.tar
          retention-days: 1

  # Playwright et axe-core sur les images construites par le job build.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      - name: Chargement des images
        run: for image in "$RUNNER_TEMP"/images/*.tar; do docker load --input "$image"; done
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
