name: Installation
description: Node (version de .nvmrc), pnpm (champ packageManager) et dépendances, avec le cache pnpm.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Lance aussi `nuxt prepare` (types de .nuxt/) via les postinstall des apps.
    - run: pnpm install --frozen-lockfile
      shell: bash
