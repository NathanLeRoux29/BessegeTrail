packages:
  - apps/*
  - packages/*

# Dépendances autorisées à exécuter un script d'installation (bloqué par défaut).
allowBuilds:
  # Pilote SQLite natif (binaire précompilé, compilé à défaut).
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true

# Versions partagées par tous les paquets : `"nuxt": "catalog:"` dans un package.json.
catalog:
  nuxt: ^4.6.4
  vue: ^3.5.46
  vue-router: ^5.5.1
  typescript: ~6.0.3
  vue-tsc: ^3.3.14
  vitest: ^5.1.1
  '@vitest/coverage-v8': ^5.1.1
  '@nuxt/test-utils': ^4.4.0
  '@types/node': ^24.0.0
  drizzle-orm: ^0.45.4
